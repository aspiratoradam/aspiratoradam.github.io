<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snail March</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: black;
        font-family: monospace;
    }

    canvas {
        display: block;
        margin: auto;
        image-rendering: pixelated;
    }

    #loginScreen {
        position: absolute;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(#111, #000);
        z-index: 10;
        flex-direction: column;
        color: white;
    }

    #loginBox {
        background: rgba(20,20,20,0.95);
        border: 3px solid #555;
        padding: 30px;
        width: 320px;
        text-align: center;
        box-shadow: 0 0 25px black;
    }

    #loginBox h1 {
        margin-top: 0;
        color: #9acd32;
        font-size: 34px;
    }

    input {
        width: 90%;
        padding: 12px;
        background: #111;
        border: 2px solid #666;
        color: white;
        font-size: 18px;
        margin-top: 10px;
    }

    button {
        margin-top: 15px;
        padding: 12px 25px;
        background: #2f4f2f;
        color: white;
        border: none;
        font-size: 18px;
        cursor: pointer;
    }

    button:hover {
        background: #466b46;
    }

    #leaderboard {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 220px;
        background: rgba(0,0,0,0.75);
        color: white;
        padding: 15px;
        border: 2px solid #444;
        z-index: 5;
    }

    #leaderboard h2 {
        margin-top: 0;
        color: #9acd32;
    }

    #musicInfo {
        position: absolute;
        bottom: 10px;
        left: 10px;
        color: rgba(255,255,255,0.5);
        z-index: 5;
        font-size: 14px;
    }
</style>
</head>
<body>

<div id="loginScreen">
    <div id="loginBox">
        <h1>Snail March</h1>
        <p>Eski dünyanın bataklığında hayatta kal.</p>

        <input type="text" id="username" placeholder="Kullanıcı adı" maxlength="14">
        <br>
        <button onclick="startGame()">OYUNA GİR</button>
    </div>
</div>

<div id="leaderboard">
    <h2>🏆 Liderlik</h2>
    <div id="leaderboardContent"></div>
</div>

<div id="musicInfo">
    ♫ March of the Snails atmosferi
</div>

<script>
let username = "Oyuncu";
let gameStarted = false;

function startGame() {
    const input = document.getElementById('username');

    if(input.value.trim() !== '') {
        username = input.value.trim();
    }

    document.getElementById('loginScreen').style.display = 'none';

    if(!gameStarted) {
        gameStarted = true;
        initGame();
    }
}

function updateLeaderboard(score) {
    let data = JSON.parse(localStorage.getItem('snailmarch_scores') || '[]');

    let existing = data.find(x => x.name === username);

    if(existing) {
        if(score > existing.score) {
            existing.score = score;
        }
    } else {
        data.push({
            name: username,
            score: score
        });
    }

    data.sort((a,b) => b.score - a.score);
    data = data.slice(0, 10);

    localStorage.setItem('snailmarch_scores', JSON.stringify(data));

    const board = document.getElementById('leaderboardContent');
    board.innerHTML = '';

    data.forEach((p, index) => {
        board.innerHTML += `
            <div style="margin-bottom:8px;">
                ${index+1}. ${p.name} - ${p.score}
            </div>
        `;
    });
}

updateLeaderboard(0);

function initGame() {

const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    backgroundColor: '#1b2a1b',
    physics: {
        default: 'arcade',
        arcade: {
            debug: false
        }
    },
    scene: {
        preload,
        create,
        update
    }
};

const game = new Phaser.Game(config);

let player;
let cursors;
let enemies;
let sword;
let score = 0;
let scoreText;
let attackCooldown = false;
let ambientParticles;

function preload() {
}

function create() {

    for(let i = 0; i < 300; i++) {
        let x = Phaser.Math.Between(0, window.innerWidth);
        let y = Phaser.Math.Between(0, window.innerHeight);

        this.add.rectangle(x, y, 2, 2, 0x324232, 0.4);
    }

    player = this.add.rectangle(
        window.innerWidth / 2,
        window.innerHeight / 2,
        32,
        32,
        0xc2b280
    );

    this.physics.add.existing(player);

    player.body.setCollideWorldBounds(true);

    sword = this.add.rectangle(player.x + 25, player.y, 24, 8, 0xc0c0c0);
    this.physics.add.existing(sword);

    enemies = this.physics.add.group();

    spawnEnemy.call(this);

    this.time.addEvent({
        delay: 2000,
        callback: () => spawnEnemy.call(this),
        loop: true
    });

    cursors = this.input.keyboard.addKeys({
        up: 'W',
        down: 'S',
        left: 'A',
        right: 'D'
    });

    this.input.on('pointerdown', () => {

        if(attackCooldown) return;

        attackCooldown = true;

        sword.width = 50;

        this.time.delayedCall(120, () => {
            sword.width = 24;
            attackCooldown = false;
        });

        enemies.getChildren().forEach(enemy => {

            const dist = Phaser.Math.Distance.Between(
                player.x,
                player.y,
                enemy.x,
                enemy.y
            );

            if(dist < 80) {
                enemy.destroy();

                score += 10;

                scoreText.setText('SKOR: ' + score);

                updateLeaderboard(score);

                flashScreen.call(this);
            }
        });
    });

    scoreText = this.add.text(20, 20,
        'SKOR: 0',
        {
            fontSize: '28px',
            fill: '#ffffff'
        }
    );

    this.add.text(20, 60,
        'Oyuncu: ' + username,
        {
            fontSize: '20px',
            fill: '#cccccc'
        }
    );
}

function update() {

    let speed = 220;

    player.body.setVelocity(0);

    if(cursors.left.isDown) {
        player.body.setVelocityX(-speed);
    }

    if(cursors.right.isDown) {
        player.body.setVelocityX(speed);
    }

    if(cursors.up.isDown) {
        player.body.setVelocityY(-speed);
    }

    if(cursors.down.isDown) {
        player.body.setVelocityY(speed);
    }

    const pointer = this.input.activePointer;

    const angle = Phaser.Math.Angle.Between(
        player.x,
        player.y,
        pointer.worldX,
        pointer.worldY
    );

    sword.x = player.x + Math.cos(angle) * 28;
    sword.y = player.y + Math.sin(angle) * 28;

    sword.rotation = angle;

    enemies.getChildren().forEach(enemy => {

        this.physics.moveToObject(enemy, player, enemy.speed);

        const dist = Phaser.Math.Distance.Between(
            player.x,
            player.y,
            enemy.x,
            enemy.y
        );

        if(dist < 25) {
            score = Math.max(0, score - 1);
            scoreText.setText('SKOR: ' + score);
        }
    });
}

function spawnEnemy() {

    const types = [
        {
            color: 0x6ab04c,
            size: 24
        },
        {
            color: 0x8e7d5b,
            size: 28
        },
        {
            color: 0x555555,
            size: 18
        }
    ];

    const type = Phaser.Utils.Array.GetRandom(types);

    let x = Phaser.Math.Between(0, window.innerWidth);
    let y = Phaser.Math.Between(0, window.innerHeight);

    const enemy = this.add.rectangle(
        x,
        y,
        type.size,
        type.size,
        type.color
    );

    this.physics.add.existing(enemy);

    enemy.speed = Phaser.Math.Between(35, 70);

    enemies.add(enemy);
}

function flashScreen() {

    const flash = this.add.rectangle(
        window.innerWidth / 2,
        window.innerHeight / 2,
        window.innerWidth,
        window.innerHeight,
        0xffffff,
        0.08
    );

    this.tweens.add({
        targets: flash,
        alpha: 0,
        duration: 150,
        onComplete: () => flash.destroy()
    });
}

}
</script>

</body>
</html>
