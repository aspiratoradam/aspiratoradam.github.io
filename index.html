<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snail March V2</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #0b0f0b;
    font-family: monospace;
}
canvas {
    display: block;
    margin: auto;
    image-rendering: pixelated;
}

#ui {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    pointer-events: none;
    color: white;
}

#leaderboard {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.6);
    padding: 10px;
    border: 1px solid #444;
    width: 200px;
}

#login {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(#0a0f0a,#000);
    flex-direction: column;
    color: white;
}

#box {
    background: rgba(0,0,0,0.8);
    padding: 20px;
    border: 2px solid #444;
    text-align: center;
}

input, button {
    padding: 10px;
    margin-top: 10px;
    width: 200px;
}

button {
    cursor: pointer;
}
</style>
</head>
<body>

<div id="login">
    <div id="box">
        <h2>RETRO KNIGHT</h2>
        <input id="name" placeholder="Kullanıcı adı" />
        <br>
        <button onclick="start()">Başla</button>
    </div>
</div>

<div id="ui">
    <div id="leaderboard"></div>
</div>

<script>
let username = "player";
let score = 0;
let game;

function start(){
    username = document.getElementById('name').value || "player";
    document.getElementById('login').style.display = 'none';
    init();
}

function saveScore(){
    let data = JSON.parse(localStorage.getItem("rk_scores") || "[]");

    let found = data.find(x => x.name === username);

    if(found){
        found.score = Math.max(found.score, score);
    } else {
        data.push({name: username, score});
    }

    data.sort((a,b)=>b.score-a.score);
    data = data.slice(0,10);

    localStorage.setItem("rk_scores", JSON.stringify(data));

    document.getElementById("leaderboard").innerHTML =
        "<b>🏆 Leaderboard</b><br>" +
        data.map((p,i)=>`${i+1}. ${p.name} - ${p.score}`).join("<br>");
}

function init(){

const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    backgroundColor: '#0b0f0b',
    physics: { default: 'arcade' },
    scene: { create, update }
};

game = new Phaser.Game(config);

let player;
let cursors;
let enemies;
let lastAttack = 0;

function create(){

    this.cameras.main.setBounds(0,0,2000,2000);
    this.physics.world.setBounds(0,0,2000,2000);

    // ground
    for(let i=0;i<400;i++){
        let x = Phaser.Math.Between(0,2000);
        let y = Phaser.Math.Between(0,2000);
        this.add.rectangle(x,y,3,3,0x1f3a1f).setAlpha(0.5);
    }

    player = this.add.rectangle(1000,1000,30,30,0xc2b280);
    this.physics.add.existing(player);
    player.body.setCollideWorldBounds(true);

    this.cameras.main.startFollow(player);

    enemies = this.physics.add.group();

    for(let i=0;i<10;i++) spawnEnemy.call(this);

    this.time.addEvent({
        delay: 1500,
        loop: true,
        callback: ()=>spawnEnemy.call(this)
    });

    cursors = this.input.keyboard.addKeys("W,A,S,D");

    this.input.on('pointerdown', ()=>{

        let now = Date.now();
        if(now - lastAttack < 250) return;
        lastAttack = now;

        this.cameras.main.shake(80,0.003);

        enemies.getChildren().forEach(e=>{
            let d = Phaser.Math.Distance.Between(player.x,player.y,e.x,e.y);

            if(d < 70){
                e.destroy();
                score += 10;
                saveScore();
            }
        });
    });

}

function update(){

    let speed = 250;
    player.body.setVelocity(0);

    if(cursors.A.isDown) player.body.setVelocityX(-speed);
    if(cursors.D.isDown) player.body.setVelocityX(speed);
    if(cursors.W.isDown) player.body.setVelocityY(-speed);
    if(cursors.S.isDown) player.body.setVelocityY(speed);

    enemies.getChildren().forEach(e=>{
        this.physics.moveToObject(e, player, 60);

        if(Phaser.Math.Distance.Between(player.x,player.y,e.x,e.y)<20){
            score = Math.max(0,score-1);
            saveScore();
        }
    });
}

function spawnEnemy(){

    const colors=[0x4caf50,0x8d6e63,0x607d8b];

    let e = this.add.rectangle(
        Phaser.Math.Between(0,2000),
        Phaser.Math.Between(0,2000),
        25,25,
        Phaser.Utils.Array.GetRandom(colors)
    );

    this.physics.add.existing(e);
    enemies.add(e);
}

}
</script>

</body>
</html>
